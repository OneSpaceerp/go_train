<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <style>
    .shell-header:hover .header-logo {
      --go-train-hover-transform: translateY(-1.5px) scale(1.04);
      --go-train-cog-transform: rotate(75deg);
    }
    .dock-item--duotone.active {
      --go-train-tile-opacity: 1;
    }
    .dock-item--duotone:hover {
      --go-train-hover-transform: translateY(-1.5px) scale(1.04);
      --go-train-cog-transform: rotate(75deg);
    }
    .go-train-bar {
      transform: var(--go-train-hover-transform, none);
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .go-train-setup-cog {
      transform: var(--go-train-cog-transform, none);
      transform-origin: 35px 35px;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .go-train-bar, .go-train-setup-cog { transition: none; }
    }
  </style>

  <defs>
    <linearGradient id="go-train-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDA6A"/>
      <stop offset="55%" stop-color="#FED14F"/>
      <stop offset="100%" stop-color="#F2BE22"/>
    </linearGradient>
    <linearGradient id="go-train-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF6D6"/>
    </linearGradient>
    <!-- Logo bike with depth (go_train_glyph.svg, simplified for small sizes) -->
    <g id="go-train-glyph">
      <defs>
      <filter id="go-train-3d-side" color-interpolation-filters="sRGB">
      <feColorMatrix values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="go-train-3d-drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2"/>
      <feOffset dx="2" dy="6" result="blur"/>
      <feFlood flood-color="#32373B" flood-opacity="0.32"/>
      <feComposite in2="blur" operator="in"/>
      </filter>
      <g id="go-train-3d-bike">
      <path fill="#32373B" fill-rule="evenodd" d="M77.1 113.1 L68.6 116.1 L61.1 120.4 L53.4 127.1 L48.1 134.4 L44.1 143.9 L42.4 151.9 L43.1 167.6 L46.1 176.1 L50.1 183.1 L57.1 191.1 L63.6 195.9 L72.1 199.9 L79.1 201.6 L98.1 201.1 L110.9 195.6 L127.9 185.9 L121.9 176.1 L121.6 170.9 L126.6 164.4 L130.9 162.6 L135.6 162.4 L131.9 160.6 L126.9 161.4 L97.1 178.1 L91.1 180.1 L82.6 179.9 L72.6 175.1 L66.1 166.9 L64.1 159.1 L66.1 147.6 L72.1 139.9 L78.4 135.9 L84.1 134.4 L93.6 135.1 L102.1 139.4 L121.1 127.9 L121.1 125.1 L115.6 120.1 L114.4 121.1 L103.6 115.1 L89.4 112.1ZM117.1 82.1 L113.9 81.6 L103.9 85.1 L104.6 86.1 L101.4 87.6 L103.1 93.6 L104.6 94.1 L107.4 92.9 L107.9 94.1 L118.1 89.9 L118.6 86.6Z"/>
      <path fill="#F1F1F1" fill-rule="evenodd" d="M159.4 143.4 L154.1 145.4 L150.9 148.6 L149.1 152.1 L148.9 157.6 L152.4 164.4 L155.6 166.6 L161.6 167.9 L165.9 166.9 L170.6 163.4 L172.9 159.6 L173.4 154.6 L171.6 149.1 L168.6 145.9 L162.9 143.4ZM122.4 61.6 L99.1 62.1 L90.1 64.4 L86.1 71.1 L85.1 83.1 L88.6 83.1 L107.1 68.9 L114.6 66.1 L121.1 65.6ZM185.4 58.6 L167.9 59.1 L131.9 110.1 L114.9 71.9 L113.4 71.4 L101.4 79.1 L104.1 85.9 L114.9 82.1 L116.6 83.1 L117.9 88.9 L107.1 94.1 L116.1 115.6 L114.6 120.6 L120.6 126.9 L82.1 150.9 L80.4 154.1 L79.9 158.6 L81.6 163.6 L84.4 166.6 L89.1 168.6 L94.9 168.1 L148.9 136.1 L156.4 133.1 L163.9 132.9 L168.6 133.9 L175.4 137.6 L180.1 142.6 L182.9 147.9 L184.1 153.1 L183.9 159.6 L179.1 169.9 L169.4 177.1 L162.9 178.6 L156.1 178.1 L147.4 174.1 L137.9 163.4 L134.6 162.1 L129.1 162.1 L124.9 164.4 L121.1 169.6 L120.6 174.1 L122.1 178.9 L126.4 184.9 L136.4 193.6 L144.9 197.9 L158.1 200.9 L166.6 200.6 L177.6 197.9 L187.4 192.6 L195.9 184.9 L202.6 173.9 L206.4 158.6 L204.9 143.6 L199.1 131.1 L189.6 120.4 L176.6 113.1 L164.4 110.6 L150.9 111.1ZM156.1 48.9 L156.9 55.4 L187.6 54.4 L187.4 48.1Z"/>
      </g>
      </defs>
      <use href="#go-train-3d-bike" filter="url(#go-train-3d-drop)"/>
      <use href="#go-train-3d-bike" transform="translate(1.50 3.00)" filter="url(#go-train-3d-side)"/>
      <use href="#go-train-3d-bike" transform="translate(1.00 2.00)" filter="url(#go-train-3d-side)"/>
      <use href="#go-train-3d-bike" transform="translate(0.50 1.00)" filter="url(#go-train-3d-side)"/>
      <use href="#go-train-3d-bike"/>
    </g>
  </defs>

  <!-- Sidebar header icon: Go Train -->
  <symbol id="icon-go-train-duotone" viewBox="0 0 48 48" fill="none">
    <rect width="48" height="48" rx="12" fill="url(#go-train-bg)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <g class="go-train-bar">
      <use href="#go-train-glyph" transform="scale(0.192)"/>
    </g>
  </symbol>

  <!-- Dock icon: Go Train -->
  <symbol id="icon-go-train-soft" viewBox="0 0 48 48" fill="none">
    <rect width="48" height="48" rx="12" fill="url(#go-train-bg)" style="opacity: var(--go-train-tile-opacity, 0.9); transition: opacity 0.15s ease"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <g class="go-train-bar">
      <use href="#go-train-glyph" transform="scale(0.192)"/>
    </g>
  </symbol>

  <!-- Sidebar header icon: Go Train Setup -->
  <symbol id="icon-go-train-setup-duotone" viewBox="0 0 48 48" fill="none">
    <rect width="48" height="48" rx="12" fill="url(#go-train-bg)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <use href="#go-train-glyph" transform="translate(-3 -4) scale(0.17)"/>
    <g class="go-train-setup-cog">
      <circle cx="35" cy="35" r="9.5" fill="#32373B"/>
      <path fill="url(#go-train-gold)" fill-rule="evenodd" d="M33.9 26.5h2.2l.4 2.1a6.7 6.7 0 0 1 1.6.9l2-.8 1.1 1.9-1.6 1.4c.1.5.2 1 .2 1.5s-.1 1-.2 1.5l1.6 1.4-1.1 1.9-2-.8a6.7 6.7 0 0 1-1.6.9l-.4 2.1h-2.2l-.4-2.1a6.7 6.7 0 0 1-1.6-.9l-2 .8-1.1-1.9 1.6-1.4a6.4 6.4 0 0 1 0-3l-1.6-1.4 1.1-1.9 2 .8a6.7 6.7 0 0 1 1.6-.9l.4-2.1ZM35 38a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
    </g>
  </symbol>

  <!-- Dock icon: Go Train Setup -->
  <symbol id="icon-go-train-setup-soft" viewBox="0 0 48 48" fill="none">
    <rect width="48" height="48" rx="12" fill="url(#go-train-bg)" style="opacity: var(--go-train-tile-opacity, 0.9); transition: opacity 0.15s ease"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <use href="#go-train-glyph" transform="translate(-3 -4) scale(0.17)"/>
    <g class="go-train-setup-cog">
      <circle cx="35" cy="35" r="9.5" fill="#32373B"/>
      <path fill="url(#go-train-gold)" fill-rule="evenodd" d="M33.9 26.5h2.2l.4 2.1a6.7 6.7 0 0 1 1.6.9l2-.8 1.1 1.9-1.6 1.4c.1.5.2 1 .2 1.5s-.1 1-.2 1.5l1.6 1.4-1.1 1.9-2-.8a6.7 6.7 0 0 1-1.6.9l-.4 2.1h-2.2l-.4-2.1a6.7 6.7 0 0 1-1.6-.9l-2 .8-1.1-1.9 1.6-1.4a6.4 6.4 0 0 1 0-3l-1.6-1.4 1.1-1.9 2 .8a6.7 6.7 0 0 1 1.6-.9l.4-2.1ZM35 38a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
    </g>
  </symbol>
</svg>
