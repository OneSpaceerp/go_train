<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#070510" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Go Train" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/go_train/images/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/go_train/images/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Go Train</title>
    <style>
      /* Pre-bundle launch screen: inline so it paints on the first frame.
         Choreographed ~3.4s athletic reveal with coral/amber auroras,
         concentric cadence rings, SVG perimeter light trace, and 4-stage ticker. */
      html, body { margin: 0; min-height: 100%; background: #F4F6FA; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']), html:not([data-theme='light']) body { background: #0B0C10; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #0B0C10; }
      .splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 0px) + 2.5rem) 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2.25rem);
        background:
          radial-gradient(115% 75% at 50% 0%, #2B0B17 0%, #120714 52%, #070510 100%);
        color: #fff; overflow: hidden; -moz-user-select: none; user-select: none; -webkit-user-select: none;
        font-family: Poppins, Cairo, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity .7s cubic-bezier(0.22, 1, 0.36, 1),
                    transform .7s cubic-bezier(0.22, 1, 0.36, 1),
                    visibility .7s;
      }
      .splash.splash-out { opacity: 0; transform: scale(1.045); visibility: hidden; pointer-events: none; }

      /* Ambient drifting auroras */
      .splash-aurora {
        position: absolute; border-radius: 9999px; filter: blur(68px);
        pointer-events: none; will-change: transform, opacity;
      }
      .splash-aurora-a {
        width: 24rem; height: 24rem; top: -7rem; left: -6rem;
        background: radial-gradient(circle, rgba(242, 61, 70, 0.52) 0%, rgba(211, 39, 49, 0) 70%);
        animation: splash-drift-a 7s ease-in-out infinite alternate;
      }
      .splash-aurora-b {
        width: 22rem; height: 22rem; bottom: -6rem; right: -5rem;
        background: radial-gradient(circle, rgba(255, 152, 0, 0.34) 0%, rgba(242, 61, 70, 0.14) 48%, rgba(7, 5, 16, 0) 72%);
        animation: splash-drift-b 8s ease-in-out infinite alternate;
      }
      .splash-aurora-c {
        width: 16rem; height: 16rem; top: 36%; left: 50%; margin-left: -8rem; margin-top: -8rem;
        background: radial-gradient(circle, rgba(251, 90, 95, 0.24) 0%, rgba(242, 61, 70, 0) 70%);
        animation: splash-halo 3.4s ease-in-out infinite;
      }

      /* Subtle athletic dot matrix */
      .splash-grid {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.22;
        background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 68%);
        -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 68%);
      }

      /* Top pill badge */
      .splash-top {
        position: relative; z-index: 2;
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.38rem 0.9rem; border-radius: 9999px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em;
        text-transform: uppercase; color: rgba(255, 230, 232, 0.82);
        opacity: 0; transform: translateY(-8px);
        animation: splash-word .65s cubic-bezier(0.22, 1, 0.36, 1) .15s forwards;
      }
      .splash-top-dot {
        width: 6px; height: 6px; border-radius: 9999px;
        background: #F23D46; box-shadow: 0 0 10px #F23D46;
        animation: splash-dot 1.4s ease-in-out infinite;
      }

      /* Center stage */
      .splash-center {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .splash-mark {
        position: relative; width: 140px; height: 140px;
        display: grid; place-items: center;
      }

      /* Concentric cadence rings */
      .splash-rings {
        position: absolute; inset: -34px; pointer-events: none;
      }
      .splash-rings span {
        position: absolute; inset: 0; border-radius: 9999px;
        border: 1px solid rgba(242, 61, 70, 0.22);
        opacity: 0;
        animation: splash-ring 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .splash-rings span:nth-child(2) { inset: 14px; animation-delay: .55s; border-color: rgba(255, 179, 0, 0.2); }
      .splash-rings span:nth-child(3) {
        inset: -6px; border-style: dashed; border-color: rgba(255, 255, 255, 0.1);
        opacity: 0.55; animation: splash-spin 22s linear infinite;
      }

      /* Ambient glow behind icon */
      .splash-halo {
        position: absolute; inset: 6px; border-radius: 36px;
        background: radial-gradient(circle, rgba(242, 61, 70, 0.58) 0%, rgba(255, 145, 0, 0.18) 55%, rgba(242, 61, 70, 0) 76%);
        filter: blur(20px);
        animation: splash-halo 2.8s ease-in-out infinite;
      }

      /* Animated SVG perimeter light trace */
      .splash-trace {
        position: absolute; inset: 12px; width: 116px; height: 116px;
        overflow: visible; pointer-events: none;
        filter: drop-shadow(0 0 10px rgba(242, 61, 70, 0.7));
      }
      .splash-trace rect {
        fill: none; stroke: url(#splash-trace-ink); stroke-width: 2.25;
        stroke-linecap: round;
        stroke-dasharray: 100; stroke-dashoffset: 100;
        animation: splash-trace 1.55s cubic-bezier(0.65, 0, 0.35, 1) .2s forwards;
      }

      /* App emblem card */
      .splash-icon {
        position: relative; width: 104px; height: 104px; border-radius: 26px;
        padding: 4px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.24), rgba(242, 61, 70, 0.18) 55%, rgba(255, 179, 0, 0.16));
        box-shadow:
          0 24px 52px -12px rgba(0, 0, 0, 0.72),
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 12px 32px -8px rgba(242, 61, 70, 0.5);
        overflow: hidden;
        opacity: 0; transform: translateY(14px) scale(0.86);
        animation:
          splash-rise .85s cubic-bezier(0.22, 1, 0.36, 1) .06s forwards,
          splash-float 3.4s ease-in-out 1s infinite;
      }
      .splash-icon img {
        width: 100%; height: 100%; -o-object-fit: cover; object-fit: cover; border-radius: 22px; display: block;
      }
      /* Diagonal light sheen sweep */
      .splash-sheen {
        position: absolute; inset: -40%; pointer-events: none;
        background: linear-gradient(115deg, transparent 36%, rgba(255, 255, 255, 0.5) 50%, transparent 64%);
        transform: translateX(-130%) rotate(12deg);
        animation: splash-sheen 1.25s cubic-bezier(0.22, 1, 0.36, 1) .85s forwards;
      }

      /* Brand title & subtitle */
      .splash-title {
        margin: 1.5rem 0 0; font-size: 1.85rem; font-weight: 700;
        letter-spacing: -0.02em; line-height: 1.15;
        background: linear-gradient(180deg, #FFFFFF 0%, #FFE4E6 65%, #FFC2C5 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0; transform: translateY(10px);
        animation: splash-word .7s cubic-bezier(0.22, 1, 0.36, 1) .55s forwards;
      }
      .splash-sub {
        margin: 0.45rem 0 0; font-size: 0.78rem; font-weight: 600;
        letter-spacing: 0.22em; text-transform: uppercase;
        color: rgba(255, 194, 197, 0.76);
        opacity: 0; transform: translateY(8px);
        animation: splash-word .7s cubic-bezier(0.22, 1, 0.36, 1) .75s forwards;
      }

      /* Metric preview pills (staggered) */
      .splash-pills {
        display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        margin-top: 1.25rem;
        opacity: 0; transform: translateY(8px);
        animation: splash-word .7s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
      }
      .splash-chip {
        padding: 0.28rem 0.7rem; border-radius: 9999px;
        font-size: 0.7rem; font-weight: 500;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.78);
      }
      .splash-chip strong { color: #FF9E80; font-weight: 600; }

      /* Bottom progress & 4-stage status ticker */
      .splash-foot {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center; gap: 0.7rem;
        width: 100%; max-width: 17.5rem;
        opacity: 0;
        animation: splash-word .65s ease .85s forwards;
      }
      .splash-status {
        display: flex; align-items: center; justify-content: center; gap: 0.55rem;
        font-size: 0.78rem; font-weight: 500; color: rgba(255, 235, 236, 0.78);
        width: 100%;
      }
      .splash-dot {
        width: 7px; height: 7px; border-radius: 9999px; flex-shrink: 0;
        background: #F23D46;
        box-shadow: 0 0 12px #F23D46;
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      .splash-steps {
        position: relative; height: 1.25rem; flex: 1; overflow: hidden; text-align: left;
      }
      [dir="rtl"] .splash-steps { text-align: right; }
      .splash-step {
        position: absolute; inset: 0;
        display: flex; align-items: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        opacity: 0; transform: translateY(8px);
      }
      .splash-step-1 { animation: splash-step-1 3.3s ease forwards; }
      .splash-step-2 { animation: splash-step-2 3.3s ease forwards; }
      .splash-step-3 { animation: splash-step-3 3.3s ease forwards; }
      .splash-step-4 { animation: splash-step-4 3.3s ease forwards; color: #FFE082; font-weight: 600; }

      .splash-bar {
        position: relative; width: 100%; height: 4px; border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
      }
      .splash-bar-fill {
        position: absolute; inset: 0; width: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #D32731 0%, #F23D46 50%, #FFB300 100%);
        transform-origin: left center; transform: scaleX(0.06);
        animation: splash-fill 3.1s cubic-bezier(0.22, 1, 0.36, 1) .15s forwards;
      }
      [dir="rtl"] .splash-bar-fill { transform-origin: right center; }
      .splash-bar-runner {
        position: absolute; inset: 0; width: 42%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        animation: splash-runner 1.25s ease-in-out .3s infinite;
      }

      @keyframes splash-rise {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.015); }
      }
      @keyframes splash-trace {
        to { stroke-dashoffset: 0; }
      }
      @keyframes splash-sheen {
        to { transform: translateX(130%) rotate(12deg); }
      }
      @keyframes splash-word {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-halo {
        0%, 100% { transform: scale(0.95); opacity: 0.72; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes splash-ring {
        0% { transform: scale(0.82); opacity: 0; }
        35% { opacity: 0.5; }
        100% { transform: scale(1.25); opacity: 0; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-drift-a {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(28px, 22px, 0) scale(1.1); }
      }
      @keyframes splash-drift-b {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        100% { transform: translate3d(-24px, -20px, 0) scale(1.12); }
      }
      @keyframes splash-dot {
        0%, 100% { transform: scale(0.88); opacity: 0.65; }
        50% { transform: scale(1.22); opacity: 1; }
      }
      @keyframes splash-step-1 {
        0%, 5% { opacity: 1; transform: translateY(0); }
        26% { opacity: 1; transform: translateY(0); }
        31%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes splash-step-2 {
        0%, 27% { opacity: 0; transform: translateY(8px); }
        32%, 54% { opacity: 1; transform: translateY(0); }
        59%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes splash-step-3 {
        0%, 55% { opacity: 0; transform: translateY(8px); }
        60%, 82% { opacity: 1; transform: translateY(0); }
        87%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes splash-step-4 {
        0%, 83% { opacity: 0; transform: translateY(8px); }
        89%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-fill {
        0% { transform: scaleX(0.06); }
        32% { transform: scaleX(0.38); }
        62% { transform: scaleX(0.72); }
        86% { transform: scaleX(0.92); }
        100% { transform: scaleX(1); }
      }
      @keyframes splash-runner {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(260%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-aurora, .splash-rings, .splash-sheen, .splash-bar-runner { display: none; }
        .splash-top, .splash-icon, .splash-title, .splash-sub, .splash-pills, .splash-foot {
          animation: none; opacity: 1; transform: none;
        }
        .splash-trace rect { animation: none; stroke-dashoffset: 0; }
        .splash-step-1, .splash-step-2, .splash-step-3 { display: none; }
        .splash-step-4 { animation: none; opacity: 1; transform: none; }
        .splash-bar-fill { animation: none; transform: scaleX(1); }
      }
    </style>
    <script type="module" crossorigin src="/assets/go_train/frontend/assets/index-fEEkxp5N.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/go_train/frontend/assets/index-CPdZdES6.css">
  <link rel="manifest" href="/assets/go_train/frontend/manifest.webmanifest"></head>
  <body>
    <div class="splash" data-splash role="status" aria-live="polite" aria-label="Loading Go Train">
      <div class="splash-aurora splash-aurora-a"></div>
      <div class="splash-aurora splash-aurora-b"></div>
      <div class="splash-aurora splash-aurora-c"></div>
      <div class="splash-grid"></div>

      <div class="splash-top">
        <span class="splash-top-dot"></span>
        <span data-splash-badge>GO TRAIN · ATHLETE &amp; COACH</span>
      </div>

      <div class="splash-center">
        <div class="splash-mark">
          <div class="splash-rings"><span></span><span></span><span></span></div>
          <div class="splash-halo"></div>
          <svg class="splash-trace" viewBox="0 0 116 116" aria-hidden="true">
            <defs>
              <linearGradient id="splash-trace-ink" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FFE082" />
                <stop offset="50%" stop-color="#F23D46" />
                <stop offset="100%" stop-color="#FF7E84" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="112" height="112" rx="28" pathLength="100" />
          </svg>
          <div class="splash-icon">
            <img src="/assets/go_train/images/go_train_logo.png" alt="Go Train" />
            <div class="splash-sheen"></div>
          </div>
        </div>
        <p class="splash-title">Go Train</p>
        <p class="splash-sub" data-splash-sub>Train · Track · Progress</p>
        <div class="splash-pills">
          <span class="splash-chip"><strong>WOD</strong> &amp; Strength</span>
          <span class="splash-chip"><strong>PR</strong> Analytics</span>
          <span class="splash-chip"><strong>Live</strong> Coaching</span>
        </div>
      </div>

      <div class="splash-foot">
        <div class="splash-status">
          <span class="splash-dot"></span>
          <div class="splash-steps">
            <span class="splash-step splash-step-1" data-splash-step="1">Warming up your training space…</span>
            <span class="splash-step splash-step-2" data-splash-step="2">Syncing programs &amp; workout blocks…</span>
            <span class="splash-step splash-step-3" data-splash-step="3">Loading PRs, metrics &amp; class schedule…</span>
            <span class="splash-step splash-step-4" data-splash-step="4">Ready — let's train</span>
          </div>
        </div>
        <div class="splash-bar">
          <div class="splash-bar-fill"></div>
          <div class="splash-bar-runner"></div>
        </div>
      </div>
    </div>
    <script>
      try {
        var u = JSON.parse(localStorage.getItem('go-train-user') || '{}');
        if (u && u.locale === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
          var steps = ['جارٍ تجهيز مساحة التدريب…', 'جارٍ مزامنة البرامج والتمارين…', 'جارٍ تحميل الأرقام القياسية والحصص…', 'جاهز — لنبدأ التدريب'];
          document.querySelectorAll('[data-splash-step]').forEach(function (el, i) { if (steps[i]) el.textContent = steps[i]; });
          var sub = document.querySelector('[data-splash-sub]');
          if (sub) sub.textContent = 'تدرّب · تتبّع · تقدّم';
        }
      } catch (e) {}
    </script>

    <div id="app"></div>
    <script id="go-train-boot" type="application/json">{{ boot_json | safe }}</script>
  </body>
</html>
