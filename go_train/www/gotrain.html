    <meta charset="UTF-8" />

    <meta name="theme-color" content="#FED14F" />
    <meta name="color-scheme" content="light dark" />

    <title>Go Train</title>
    <style>
      /* Pre-bundle launch screen: inline so it paints on the first frame. The
         logo's yellow fills the screen (matching the manifest background_color,
         so Android's own launch screen hands over seamlessly); the bike rides in,
         then the wordmark, status and progress settle. ~2.4s, see lib/splash.js. */
      html, body { margin: 0; min-height: 100%; background: #F1F1F1; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']), html:not([data-theme='light']) body { background: #1B1E20; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #1B1E20; }
      .splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 0px) + 2.5rem) 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2.5rem);
        background: #FED14F; color: #32373B; overflow: hidden;
        -moz-user-select: none;
             user-select: none; -webkit-user-select: none;
        font-family: Poppins, Cairo, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity .5s cubic-bezier(0.22, 1, 0.36, 1), visibility .5s;
      }
      .splash.splash-out { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-out .splash-center { transform: scale(1.06); transition: transform .5s cubic-bezier(0.22, 1, 0.36, 1); }

      .splash-center {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }
      .splash-ride { position: relative; width: 184px; height: 184px; }
      .splash-bike {
        position: relative; width: 100%; height: 100%; display: block;
        opacity: 0; transform: translateX(-56px);
        animation: splash-ride .9s cubic-bezier(0.16, 1, 0.3, 1) .1s forwards;
      }
      [dir="rtl"] .splash-bike { transform: translateX(56px); }
      /* Ground shadow grows as the bike arrives */
      .splash-ride::after {
        content: ''; position: absolute; left: 18%; right: 14%; bottom: -10px; height: 10px;
        border-radius: 50%; background: rgba(50, 55, 59, 0.16);
        transform: scaleX(0.3); opacity: 0;
        animation: splash-ground .9s cubic-bezier(0.16, 1, 0.3, 1) .1s forwards;
      }

      .splash-title {
        margin: 2rem 0 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
        opacity: 0; transform: translateY(10px);
        animation: splash-word .6s cubic-bezier(0.22, 1, 0.36, 1) .55s forwards;
      }
      .splash-sub {
        margin: 0.5rem 0 0; font-size: 0.8rem; font-weight: 600;
        letter-spacing: 0.2em; text-transform: uppercase; color: rgba(50, 55, 59, 0.78);
        opacity: 0; transform: translateY(8px);
        animation: splash-word .6s cubic-bezier(0.22, 1, 0.36, 1) .7s forwards;
      }

      .splash-foot {
        display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
        width: 100%; max-width: 16rem;
        opacity: 0; animation: splash-word .5s ease .6s forwards;
      }
      .splash-steps {
        position: relative; width: 100%; height: 1.25rem; overflow: hidden;
        font-size: 0.8rem; font-weight: 500; color: rgba(50, 55, 59, 0.82); text-align: center;
      }
      .splash-step {
        position: absolute; inset: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        opacity: 0; transform: translateY(8px);
      }
      .splash-step-1 { animation: splash-step-1 2.4s ease forwards; }
      .splash-step-2 { animation: splash-step-2 2.4s ease forwards; }
      .splash-step-3 { animation: splash-step-3 2.4s ease forwards; }
      .splash-step-4 { animation: splash-step-4 2.4s ease forwards; font-weight: 700; color: #32373B; }
      .splash-bar {
        position: relative; width: 100%; height: 4px; border-radius: 9999px;
        background: rgba(50, 55, 59, 0.16); overflow: hidden;
      }
      .splash-bar-fill {
        position: absolute; inset: 0; border-radius: inherit; background: #32373B;
        transform-origin: left center; transform: scaleX(0.04);
        animation: splash-fill 2.3s cubic-bezier(0.22, 1, 0.36, 1) .1s forwards;
      }
      [dir="rtl"] .splash-bar-fill { transform-origin: right center; }

      @keyframes splash-ride { to { opacity: 1; transform: translateX(0); } }
      @keyframes splash-ground { to { opacity: 1; transform: scaleX(1); } }
      @keyframes splash-word { to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-step-1 {
        0%, 4% { opacity: 1; transform: translateY(0); }
        24% { opacity: 1; transform: translateY(0); }
        30%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes splash-step-2 {
        0%, 26% { opacity: 0; transform: translateY(8px); }
        32%, 52% { opacity: 1; transform: translateY(0); }
        58%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes splash-step-3 {
        0%, 54% { opacity: 0; transform: translateY(8px); }
        60%, 78% { opacity: 1; transform: translateY(0); }
        84%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes splash-step-4 {
        0%, 80% { opacity: 0; transform: translateY(8px); }
        86%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-fill {
        0% { transform: scaleX(0.04); }
        40% { transform: scaleX(0.45); }
        75% { transform: scaleX(0.8); }
        100% { transform: scaleX(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-bike, .splash-ride::after, .splash-title, .splash-sub, .splash-foot {
          animation: none; opacity: 1; transform: none;
        }
        .splash-step-1, .splash-step-2, .splash-step-3 { display: none; }
        .splash-step-4 { animation: none; opacity: 1; transform: none; }
        .splash-bar-fill { animation: none; transform: scaleX(1); }
        .splash-out .splash-center { transform: none; }
      }
    </style>

    <script>
      try {
        var u = JSON.parse(localStorage.getItem('go-train-user') || '{}');
        if (u && u.locale === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
          var steps = ['جارٍ تجهيز مساحة التدريب…', 'جارٍ مزامنة البرامج والتمارين…', 'جارٍ تحميل الأرقام القياسية والحصص…', 'جاهز — لنبدأ التدريب'];
          document.querySelectorAll('[data-splash-step]').forEach(function (el, i) { if (steps[i]) el.textContent = steps[i]; });
          var sub = document.querySelector('[data-splash-sub]');
          if (sub) sub.textContent = 'تدرّب · تتبّع · تقدّم';
        }
      } catch (e) {}

      // Register the service worker from the page itself, so it installs even if the
      // app bundle fails to load; lib/pwa.js reuses this registration for updates.
      if ('serviceWorker' in navigator) {
        window.goTrainSW = new Promise(function (resolve, reject) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/api/method/go_train.api.pwa.sw', { scope: '/gotrain' }).then(resolve, reject);
          });
        });
        window.goTrainSW.catch(function () {});
      }
    </script>

    <div id="app"></div>
    <script id="go-train-boot" type="application/json">{{ boot_json | safe }}</script>
