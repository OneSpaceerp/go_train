<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Go Train</title>
    <meta name="description" content="Train, track and progress — programs, workouts and classes for your gym." />
    <meta name="theme-color" content="#FB5A5F" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Go Train" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Rendered by Frappe (www/go_train.py). In Vite dev these stay as literal braces and are ignored. -->
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="site-name" content="{{ site_name }}" />
    <link rel="icon" type="image/png" href="/assets/go_train/images/go_train_logo.png" />
    <link rel="apple-touch-icon" href="/assets/go_train/images/go_train_logo.png" />
    <!-- Launch screen: shown before the app bundle loads. Class selectors only
         (this file is rendered by Jinja; a "{" then "#" would start a Jinja comment). -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(130% 95% at 50% 40%, #ff7e84 0%, #fb5a5f 42%, #c42730 100%);
        color: #fff;
        font-family: Poppins, Cairo, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.5s ease, visibility 0s linear 0.5s;
      }
      .splash-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1.4px);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 0, transparent 60%);
        mask-image: radial-gradient(circle at 50% 44%, #000 0, transparent 60%);
        opacity: 0;
        animation: splash-in 1.2s ease 0.2s forwards;
      }
      .splash-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -6vh;
      }
      .splash-icon {
        width: clamp(104px, 28vw, 128px);
        aspect-ratio: 1;
        border-radius: 24%;
        overflow: hidden;
        box-shadow: 0 24px 50px -14px rgba(90, 10, 15, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.18);
        opacity: 0;
        transform: translateY(16px) scale(0.78);
        filter: blur(10px);
        animation: splash-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards,
          splash-float 4s ease-in-out 2s infinite;
      }
      .splash-icon img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .splash-word {
        margin: 30px 0 0;
        display: flex;
        gap: 0.3em;
        overflow: hidden;
        font-size: clamp(26px, 7.4vw, 32px);
        font-weight: 600;
        letter-spacing: 0.18em;
      }
      .splash-word span {
        display: inline-block;
        transform: translateY(110%);
        animation: splash-slide 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-tag {
        margin: 10px 0 0;
        font-size: 14px;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.82);
        opacity: 0;
        animation: splash-in 0.7s ease 1.2s forwards;
      }
      .splash-by {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom) + 28px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        opacity: 0;
        animation: splash-in 0.8s ease 1.5s forwards;
      }
      .splash-by small {
        font-size: 10px;
        letter-spacing: 0.24em;
        color: rgba(255, 255, 255, 0.55);
      }
      .splash-by span {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.85);
      }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-rise { to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
      @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes splash-slide { to { transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .splash *, .splash *::before { animation: none !important; }
        .splash-grid, .splash-icon, .splash-tag, .splash-by { opacity: 1; transform: none; filter: none; }
        .splash-word span { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="splash" data-splash role="status" aria-label="Go Train is loading">
      <div class="splash-grid"></div>
      <div class="splash-center" aria-hidden="true">
        <div class="splash-icon">
          <img src="/assets/go_train/images/go_train_logo.png" alt="" width="512" height="512" decoding="sync" fetchpriority="high" />
        </div>
        <p class="splash-word"><span style="animation-delay: 0.85s">GO</span><span style="animation-delay: 0.97s">TRAIN</span></p>
        <p class="splash-tag">Train. Track. Progress.</p>
      </div>
      <p class="splash-by" aria-hidden="true"><small>FROM</small><span>nsdLabs</span></p>
    </div>
    <div id="app"></div>
    <script id="go-train-boot" type="application/json">{{ boot_json | safe }}</script>
    <!-- In production, copy-entry.js injects the hashed Vite build tags above #app.
         In Vite dev, main.js is loaded by the dev server. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
